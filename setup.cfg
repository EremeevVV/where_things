[flake8]
# Only select wemake-python-styleguide rules (WPS prefix).
# Everything else (E, F, W, C90, B, ...) is covered by ruff — no duplication.
select = WPS

# Line length must match line-length in pyproject.toml,
# otherwise WPS will complain about length independently of ruff.
max-line-length = 120

# WPS measures complexity with its own metrics (cognitive complexity,
# branch count, nesting depth) — codes don't overlap with ruff/mccabe.
max-cognitive-score = 12
max-cognitive-average = 8

ignore =
    # WPS421 — print instead of logging in YDB module (stdout → Cloud Functions Logs API).
    WPS421,
    # WPS110 — "wrong" names: result, items, data, handler.
    # Standard Python names; violated in main.py, handlers.py, memory_repository.py.
    WPS110,
    # WPS111 — short names: q, e. Conventional for query/exception.
    # Violated in memory_repository.py, ydb_repository.py.
    WPS111,

per-file-ignores =
    # src/handlers.py — single handlers file for a small skill
    src/handlers.py: WPS202,WPS210,WPS221,WPS226,WPS336,WPS347
    # src/ydb_repository.py — YDB driver structure and SQL parameters
    src/ydb_repository.py: WPS121,WPS122,WPS226,WPS229,WPS301,WPS420,WPS458
    # src/memory_repository.py — idiomatic dict.get() usage
    src/memory_repository.py: WPS234,WPS529
    # src/nlu/__init__.py — package exports
    src/nlu/__init__.py: WPS235,WPS410,WPS412
    # src/nlu/intents.py — intent models with repeated slot names
    src/nlu/intents.py: WPS226
    # src/nlu/thing/__init__.py — package exports
    src/nlu/thing/__init__.py: WPS410,WPS412
    # src/nlu/thing/canonical_dict.py — mutable module constant for dictionary
    src/nlu/thing/canonical_dict.py: WPS407
    # src/nlu/thing/canonicalizer.py — canonicalization logic
    src/nlu/thing/canonicalizer.py: WPS221
    # src/nlu/thing/decomposer.py — morphological decomposition with many locals
    src/nlu/thing/decomposer.py: WPS210,WPS221,WPS231,WPS314
    # src/nlu/thing/matcher.py — matching logic with scoring
    src/nlu/thing/matcher.py: WPS210,WPS237,WPS358,WPS441
    # tests/* — test-specific patterns: names, structure, assertions, cleanup
    tests/*.py: WPS115,WPS202,WPS210,WPS213,WPS214,WPS218,WPS221,WPS223,WPS226,WPS229,WPS231,WPS237,WPS243,WPS407,WPS432,WPS501
    tests/nlu/thing/*.py: WPS204,WPS218,WPS226

exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    .ruff_cache
    .air
    test_data
