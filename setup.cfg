[flake8]
# Отвечает только за коды WPS (wemake-python-styleguide).
# Всё остальное (E/F/W/C90/B/...) закрыто ruff (pyproject.toml) — без дублирования.
select = WPS

# Должно совпадать с line-length в pyproject.toml.
max-line-length = 120

# Собственные метрики сложности WPS (когнитивная сложность, не mccabe из ruff).
max-cognitive-score = 12
max-cognitive-average = 8

# ==============================================================================
# СТАТУС ФАЙЛА: ЗАФИКСИРОВАН владельцем репозитория 2026-07-20.
# Проверено построчно по логу `flake8 --select=WPS src tests` без исключений
# (полный прогон от 2026-07-19) и по исходникам handlers.py, matcher.py.
#
# Кодирующему агенту запрещено редактировать этот файл без явного согласия
# владельца — ни добавлять новые коды/файлы, ни менять существующие строки.
# Исключение: агенту разрешено УДАЛЯТЬ строки из блока "ВРЕМЕННЫЕ" по мере
# фактического устранения проблемы в коде (после чего flake8 сам покажет
# ошибку, если удаление было преждевременным).
#
# Расширение списка исключений (добавление новых WPS-кодов или файлов)
# допускается ТОЛЬКО с явного согласия владельца репозитория.
# ==============================================================================

per-file-ignores =
    # --------------------------------------------------------------------
    # ПОСТОЯННЫЕ. Обусловлены контрактом библиотеки/платформы, а не стилем
    # автора. Пересматривать только если сама библиотека/платформа изменит
    # требование — см. обоснование у каждой строки.
    # --------------------------------------------------------------------

    # F — собственный DSL-экспорт aliceio для фильтров (F.session.new,
    # F.nlu.intents[...]), общепринятое имя во всей экосистеме aiogram-подобных
    # фреймворков. handler/data (сигнатура AuthMiddleware.__call__) сюда
    # НЕ включены — закрыты точечно `# noqa: WPS110` прямо на строках 42 и 44
    # src/handlers.py, а не файловым исключением.
    src/handlers.py: WPS347

    # Три независимых требования YDB/платформы Yandex Cloud Functions:
    #  * WPS121, WPS122, WPS420 — module-level singleton driver/pool через
    #    global для переиспользования соединения между "тёплыми" вызовами
    #    Cloud Functions — паттерн платформы, не стиль автора.
    #  * WPS226 ($user_id) — имя bind-параметра YQL обязано быть литералом
    #    в каждом SQL-тексте (синтаксис YDB), не выносится в константу.
    #  * WPS301, WPS458 — `import ydb.iam` рядом с `import ydb` — стандартный
    #    способ подключения IAM-аутентификации по документации YDB SDK.
    src/db/ydb.py: WPS110,WPS121,WPS122,WPS210,WPS226,WPS229,WPS301,WPS420,WPS458,WPS504
    src/db/memory.py: WPS111

    # Идиома re-export пакета: __init__.py с логикой (WPS412) и __all__
    # (WPS410) нужны, чтобы объявить публичный интерфейс пакета.
    # WPS235 в nlu/__init__.py (9 > 8 импортов) — прямое следствие количества
    # ре-экспортов. Если список продолжит расти — разбить на подпакеты,
    # а не продлевать исключение.
    src/db/__init__.py: WPS410,WPS412
    src/nlu/__init__.py: WPS235,WPS410,WPS412
    src/nlu/thing/__init__.py: WPS410,WPS412

    # Контракт Yandex Cloud Functions: имя функции-обработчика обязано быть
    # `handler`, а вспомогательный объект — `_handler` (см. main.py:28,31).
    main.py: WPS110

    # --------------------------------------------------------------------
    # ВРЕМЕННЫЕ. Технический долг с конкретным планом устранения —
    # см. RECOMMENDATIONS.md. Агент может УДАЛЯТЬ строки по мере фикса,
    # но не добавлять новые без согласия владельца.
    # --------------------------------------------------------------------

    # Разбиение handlers.py на middleware.py + модули по интентам снимет
    # WPS202/WPS210/WPS221.
    src/handlers.py: WPS202,WPS210,WPS221

    # Снимается разбиением decompose() на 2-3 функции (см. RECOMMENDATIONS.md,
    # приоритет 2).
    src/nlu/thing/decomposer.py: WPS234

    # WPS358 — 0.0 в NO_OVERLAP_SCORE нужен явно: нулевой score означает
    # «нет пересечений модификаторов», а не ошибку округления.
    src/nlu/thing/matcher.py: WPS358

    # WPS243 — finally в fixture restoration нужен для 3 переменных.
    # WPS115 — TEST_USER: константа в классе тестов, общепринятый паттерн.
    tests/test_ydb.py: WPS115,WPS243

    # Общий долг больших тестовых файлов: отсутствие parametrize, короткие
    # имена (q, c, k, v...), переменная result, magic numbers таймингов.
    # Снимается поэтапно (приоритет 3). print() сюда не входит — см. ниже.
    tests/*.py: WPS110,WPS111,WPS115,WPS202,WPS210,WPS213,WPS214,WPS218,WPS221,WPS223,WPS226,WPS231,WPS237,WPS407,WPS432
    tests/nlu/thing/*.py: WPS204

    # --------------------------------------------------------------------
    # ПОСТОЯННЫЕ (вторая группа). CLI-инструменты для разработчика, а не
    # автотесты, исполняемые в CI. print() — их интерфейс с человеком,
    # запускающим их вручную в терминале, а не забытый debug-вывод.
    # --------------------------------------------------------------------
    tests/test_runner.py: WPS421
    tests/test_handler_manual.py: WPS421

exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    .ruff_cache,
    .air,
    test_data
